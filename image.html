<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mister chad's demo page</title>
  <style>
    body {
      background-image: url("tile.png");
      color: rgb(156, 7, 7);
    }
    img {
      border: 5px solid black;
      border-radius: 50px;
      box-shadow: 10px 10px 10px #5558;
      transition: transform .5s;
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 900px;
    }

    img:hover {
      transform: scale(1.05);
    }

  </style>
</head>

<body>
  <img src="winter.jpg" alt="cold village in the mountains" />
  <h1>my image</h1>
  <p>This is a picture of stuff.</p>
</body>

</html>
