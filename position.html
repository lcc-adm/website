<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mister chad's demo page</title>
  <style>
div {
  width: 300px;
  height: 300px;
  background: #000;
  margin: 50px;
}
#static {
  background: orange;
  position: static; /* default */
}
#sticky {
  background: pink;
  position: sticky; /* scrolls until hits edge */
}
#relative {
  background: yellow;
  position: relative; /* can move out of place but leaves hole */
  left: 100px;
  top: -100px;
  z-index: -5;
}
#fixed {
  background: #beeb5d;
  position: fixed; /* sticks to screen, not scroll and removes hole */
  left: 200px;
  top: 0;
}
#absolute {
  background: #c5a3e7;
  position: absolute; /* sticks to scroll and removes hole */
  left: 300px;
  bottom: -300px;
}
  </style>
</head>

<body>
 <div id="static"></div>
 <div id="sticky"></div>
 <div id="relative"></div>
 <div id="fixed"></div>
 <div id="absolute"></div>
</body>

</html>
