<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mister chad's demo page</title>
  <style>
div {
  width: 300px;
  height: 300px;
  background: #000;
  margin: 50px;
}
#static {
  background: red;
  position: static;  /* default position */
}
#sticky {
  background: orange;
  position: sticky; /* static until hits edge */
}
#relative {
  background: yellow;
  position: relative; /* moves box but leaves hole */
  left: 100px;
  top: -100px;
  z-index: -10;
}
#fixed {
  background: greenyellow;
  position: fixed; /* stuck to screen, leaves no hole */
  top: 50px;
  right: 50px;
}
#absolute {
  background: lightskyblue;
  position: absolute; /* stuck to content, no hole */
  right: 30px;
  bottom: 50px;
}
  </style>
</head>

<body>
 <div id="static"></div>
 <div id="sticky"></div>
 <div id="relative"></div>
 <div id="fixed"></div>
 <div id="absolute"></div>
</body>

</html>
