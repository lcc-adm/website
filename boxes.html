<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mister chad's demo page</title>
  <style>
    body {
      background: linear-gradient( 0deg,  rgba(160,24,80,1) 11.2%, rgba(201,138,75,1) 81.7% );
      background-size: cover;
      background-attachment: fixed;
    }
    div {
      background: pink;
      border: 10px solid red;
      width: 500px;
      height: 100px;
      padding: 20px;
      margin: 20px;
      border-radius: 30px;
    }

    #one {
      background: olive;
      border: 10px solid black;
      border-bottom: 25px solid black;
      color: white;
      margin-left: 200px;
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
      border-top-right-radius: 200px;
      border-top-left-radius: 200px;
      text-align: center;
    }

    #two {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    #three {
      width: 800px;
      height: 200px;
      background-image: linear-gradient( 270deg,  rgb(215, 62, 126) 11.2%, rgb(237, 238, 126) 81.7% );
    }
    #four {
      width: 200px;
      height: 50px;
    }
  </style>
</head>

<body>
  <div id="one">
    <p>this is a box!</p>
  </div>
  <div id="two">
    <p>this is a box!</p>
  </div>
  <div id="three">
    <p>this is a box!</p>
    <div id="four">
      <p>this is a box!</p>
    </div>
  </div>
</body>

</html>
