<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mister chad's demo page</title>
  <style>
    body {
      background-size: cover;
      background-attachment: fixed;
      background-image: radial-gradient( circle farthest-corner at 10% 20%,  rgba(253,246,5,1) 0%, rgba(245,139,139,1) 100.3% );
    }
    div {
      background: pink;
      border: 10px solid black;
      width: 600px;
      height: 100px;
      padding: 50px;
      margin: 50px;
      border-radius: 30px;
    }

    #one {
      width: 200px;
      background: red;
      color: white;
      margin-left: 300px;
      border-bottom: 40px solid black;
      border-bottom-left-radius: 0px;
      border-bottom-right-radius: 0px;
    }

    #two {
      margin-left: auto;
      margin-right: auto;
      text-align: center;
      background: linear-gradient(0deg,rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 51%, rgba(237, 221, 83, 1) 100%);
    }

    #three {
      height: 300px;
      background-image: radial-gradient( circle farthest-corner at 9.8% 19.4%,  rgba(223,75,75,1) 11.6%, rgba(20,12,12,1) 90.5% );
    }

    #four {
      width: 100px;
      margin: 0;
    }
  </style>
</head>

<body>
  <div id="one">
    <p>this is a box!</p>
  </div>
  <div id="two">
    <p>this is a box!</p>
  </div>
  <div id="three">
    <p>this is a box!</p>
    <div id="four">
      <p>this is a box!</p>
    </div>
  </div>
</body>

</html>
